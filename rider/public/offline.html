<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf3">
  <title>Offline | Tsela</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f2e9; color: #111; font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 440px; padding: 28px; border: 2px solid #111; border-radius: 20px; background: #fffdf3; box-shadow: 5px 5px 0 #111; }
    h1 { margin: 0 0 8px; font-size: 1.75rem; letter-spacing: -0.03em; }
    p { margin: 0 0 16px; color: #3c3e37; }
    button { min-height: 48px; padding: 0 22px; border: 2px solid #111; border-radius: 12px; background: #445cff; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #445cff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline.</h1>
    <p>Tsela could not reach the network. Routes you opened recently may still be available from this device, and anything you wrote will be sent when you reconnect.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
