services:
  db:
    build:
      context: ./database
    container_name: transit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transitsym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metro}
      POSTGRES_DB: ${POSTGRES_DB:-transit}
    ports:
      - "127.0.0.1:6000:5432"
    volumes:
      - transit_system:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitsym -d transit"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api
      additional_contexts:
        handbook: ./docs
    container_name: transit-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-transitsym}:${POSTGRES_PASSWORD:-metro}@db:5432/${POSTGRES_DB:-transit}?connect_timeout=3
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
      DEVELOPER_PORTAL_URL: http://localhost:3003
      API_DOCS_ENABLED: "false"
      DEMO_ACCOUNT_ENABLED: "true"
      DEMO_ACCOUNT_EMAIL: demo@tsela.local
      DEMO_ACCOUNT_PASSWORD: TselaDemo2026!
      GRAFANA_WEBHOOK_SECRET: ${GRAFANA_WEBHOOK_SECRET:-local-grafana-webhook}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:-local-development-token-hash-secret-change-me}
      SANDBOX_API_KEY: ${DOCS_SANDBOX_API_KEY:-tos_live_local_docs_sandbox_key_not_for_production}
      HANDBOOK_DIR: /app/handbook
      GRAFANA_PUBLIC_URL: http://localhost:3004
      PROMETHEUS_PUBLIC_URL: http://localhost:9090
      PROMETHEUS_INTERNAL_URL: http://prometheus:9090
      DEPLOYMENT_ENVIRONMENT: local-compose
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_TRACE_SAMPLE_RATIO: "1.0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  marketing:
    build:
      context: ./marketing
      args:
        NEXT_PUBLIC_RIDER_URL: http://localhost:3002
        NEXT_PUBLIC_OPS_URL: http://localhost:3001
        NEXT_PUBLIC_DOCS_URL: http://localhost:3003
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    container_name: transit-marketing
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_RIDER_URL: http://localhost:3002
      NEXT_PUBLIC_OPS_URL: http://localhost:3001
      NEXT_PUBLIC_DOCS_URL: http://localhost:3003
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"

  rider:
    build:
      context: ./rider
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    container_name: transit-rider
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    container_name: transit-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: transit-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: transit-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-transitsym}:${POSTGRES_PASSWORD:-metro}@db:5432/${POSTGRES_DB:-transit}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    container_name: transit-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3004
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tsela-platform.json
      GRAFANA_WEBHOOK_SECRET: ${GRAFANA_WEBHOOK_SECRET:-local-grafana-webhook}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3004:3000"
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:2.8.2
    container_name: transit-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  docs:
    build:
      context: ./docs-site
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_MARKETING_URL: http://localhost:3000
        NEXT_PUBLIC_DEMO_MODE: "true"
        NEXT_PUBLIC_DEMO_EMAIL: demo@tsela.local
        NEXT_PUBLIC_DEMO_PASSWORD: TselaDemo2026!
    container_name: transit-docs
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      DOCS_SANDBOX_API_KEY: ${DOCS_SANDBOX_API_KEY:-tos_live_local_docs_sandbox_key_not_for_production}
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_MARKETING_URL: http://localhost:3000
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_EMAIL: demo@tsela.local
      NEXT_PUBLIC_DEMO_PASSWORD: TselaDemo2026!
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      api:
        condition: service_healthy

volumes:
  transit_system:
  prometheus_data:
  grafana_data:
  tempo_data:
