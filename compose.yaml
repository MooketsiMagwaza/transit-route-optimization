services:
  db:
    build:
      context: ./database
    container_name: transit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transitsym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metro}
      POSTGRES_DB: ${POSTGRES_DB:-transit}
    ports:
      - "127.0.0.1:6000:5432"
    # Continuous WAL archiving is always on so point-in-time recovery is possible from day one.
    # archive_timeout bounds the recovery point objective to five minutes of activity.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - transit_system:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ./ops/recovery/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitsym -d transit"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api
      additional_contexts:
        handbook: ./docs
    container_name: transit-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-transitsym}:${POSTGRES_PASSWORD:-metro}@db:5432/${POSTGRES_DB:-transit}?connect_timeout=3
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
      DEVELOPER_PORTAL_URL: http://localhost:3003
      API_DOCS_ENABLED: "false"
      DEMO_ACCOUNT_ENABLED: "true"
      DEMO_ACCOUNT_EMAIL: demo@tsela.local
      DEMO_ACCOUNT_PASSWORD: TselaDemo2026!
      GRAFANA_WEBHOOK_SECRET: ${GRAFANA_WEBHOOK_SECRET:-local-grafana-webhook}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:-local-development-token-hash-secret-change-me}
      AUTH_ISSUER: ${AUTH_PUBLIC_URL:-http://localhost:9999}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-development-jwt-secret-change-me-32-chars}
      AUTH_AUDIENCE: authenticated
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      SANDBOX_API_KEY: ${DOCS_SANDBOX_API_KEY:-tos_live_local_docs_sandbox_key_not_for_production}
      HANDBOOK_DIR: /app/handbook
      GRAFANA_PUBLIC_URL: http://localhost:3004
      PROMETHEUS_PUBLIC_URL: http://localhost:9090
      PROMETHEUS_INTERNAL_URL: http://prometheus:9090
      DEPLOYMENT_ENVIRONMENT: local-compose
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_TRACE_SAMPLE_RATIO: "1.0"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  marketing:
    build:
      context: ./marketing
      args:
        NEXT_PUBLIC_RIDER_URL: http://localhost:3002
        NEXT_PUBLIC_OPS_URL: http://localhost:3001
        NEXT_PUBLIC_DOCS_URL: http://localhost:3003
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    container_name: transit-marketing
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_RIDER_URL: http://localhost:3002
      NEXT_PUBLIC_OPS_URL: http://localhost:3001
      NEXT_PUBLIC_DOCS_URL: http://localhost:3003
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"

  rider:
    build:
      context: ./rider
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_AUTH_URL: ${AUTH_PUBLIC_URL:-}
        NEXT_PUBLIC_GOOGLE_AUTH: ${GOOGLE_OAUTH_ENABLED:-false}
    container_name: transit-rider
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_AUTH_URL: ${AUTH_PUBLIC_URL:-}
    container_name: transit-admin
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: transit-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
      postgres-exporter:
        condition: service_started

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: transit-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-transitsym}:${POSTGRES_PASSWORD:-metro}@db:5432/${POSTGRES_DB:-transit}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    container_name: transit-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3004
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tsela-platform.json
      GRAFANA_WEBHOOK_SECRET: ${GRAFANA_WEBHOOK_SECRET:-local-grafana-webhook}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3004:3000"
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:2.8.2
    container_name: transit-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  docs:
    build:
      context: ./docs-site
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_MARKETING_URL: http://localhost:3000
        NEXT_PUBLIC_DEMO_MODE: "true"
        NEXT_PUBLIC_DEMO_EMAIL: demo@tsela.local
        NEXT_PUBLIC_DEMO_PASSWORD: TselaDemo2026!
        NEXT_PUBLIC_AUTH_URL: ${AUTH_PUBLIC_URL:-}
        NEXT_PUBLIC_GOOGLE_AUTH: ${GOOGLE_OAUTH_ENABLED:-false}
    container_name: transit-docs
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      DOCS_SANDBOX_API_KEY: ${DOCS_SANDBOX_API_KEY:-tos_live_local_docs_sandbox_key_not_for_production}
      COOKIE_SECURE: "false"
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_MARKETING_URL: http://localhost:3000
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_DEMO_EMAIL: demo@tsela.local
      NEXT_PUBLIC_DEMO_PASSWORD: TselaDemo2026!
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      api:
        condition: service_healthy

  # ── Identity (opt-in): docker compose --profile identity up -d ───────────────
  auth-db-init:
    profiles: ["identity"]
    image: postgres:16-alpine
    container_name: transit-auth-db-init
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transitsym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metro}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-local-auth-db-password}
    volumes:
      - ./ops/identity/init-auth-db.sh:/init-auth-db.sh:ro
    entrypoint: ["sh", "/init-auth-db.sh"]
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    profiles: ["identity"]
    image: axllent/mailpit:v1.31
    container_name: transit-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  auth:
    profiles: ["identity"]
    image: supabase/gotrue:v2.197.0
    container_name: transit-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${AUTH_PUBLIC_URL:-http://localhost:9999}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:-local-auth-db-password}@db:5432/tsela_auth
      GOTRUE_SITE_URL: http://localhost:3003
      GOTRUE_URI_ALLOW_LIST: http://localhost:3003/**,http://localhost:3002/**,http://localhost:3001/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET:-local-development-jwt-secret-change-me-32-chars}
      GOTRUE_JWT_EXP: "43200"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ISSUER: ${AUTH_PUBLIC_URL:-http://localhost:9999}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASSWORD:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM:-no-reply@tsela.local}
      GOTRUE_SMTP_SENDER_NAME: Tsela
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "4"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      # Google is optional: leave these empty locally; production supplies real OAuth credentials.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${AUTH_PUBLIC_URL:-http://localhost:9999}/callback
    ports:
      - "127.0.0.1:9999:9999"
    depends_on:
      auth-db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # ── Recovery (opt-in): docker compose --profile recovery up -d ───────────────
  objects:
    profiles: ["recovery"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: transit-objects
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tsela-objects-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-objects-admin-password}
    volumes:
      - object_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  objects-init:
    profiles: ["recovery"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: transit-objects-init
    restart: "no"
    entrypoint: ["sh", "/objects-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tsela-objects-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-objects-admin-password}
      UPLOADS_BUCKET: tsela-uploads
      BACKUPS_BUCKET: tsela-backups
      UPLOADS_ACCESS_KEY: ${UPLOADS_ACCESS_KEY:-tsela-uploads-app}
      UPLOADS_SECRET_KEY: ${UPLOADS_SECRET_KEY:-local-uploads-secret-key}
      BACKUPS_ACCESS_KEY: ${BACKUPS_ACCESS_KEY:-tsela-backups-app}
      BACKUPS_SECRET_KEY: ${BACKUPS_SECRET_KEY:-local-backups-secret-key}
    volumes:
      - ./ops/recovery/objects-init.sh:/objects-init.sh:ro
    depends_on:
      - objects

  recovery-init:
    profiles: ["recovery"]
    image: postgres:16-alpine
    container_name: transit-recovery-init
    restart: "no"
    entrypoint: ["sh", "/recovery-init.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transitsym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metro}
      POSTGRES_DB: ${POSTGRES_DB:-transit}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-local-replication-password}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-local-backup-db-password}
    volumes:
      - ./ops/recovery/recovery-init.sh:/recovery-init.sh:ro
    depends_on:
      api:
        condition: service_healthy

  db-standby:
    profiles: ["recovery"]
    build:
      context: ./database
    container_name: transit-db-standby
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/bash", "/standby-entrypoint.sh"]
    environment:
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-local-replication-password}
    volumes:
      - standby_data:/var/lib/postgresql/data
      - ./ops/recovery/standby-entrypoint.sh:/standby-entrypoint.sh:ro
    ports:
      - "127.0.0.1:6001:5432"
    depends_on:
      recovery-init:
        condition: service_completed_successfully

  backup:
    profiles: ["recovery"]
    build:
      context: ./ops/backups
    container_name: transit-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-transit}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-local-backup-db-password}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-local-only-passphrase-replace-in-real-use}
      OFFSITE_ENDPOINT: http://objects:9000
      OFFSITE_ACCESS_KEY: ${BACKUPS_ACCESS_KEY:-tsela-backups-app}
      OFFSITE_SECRET_KEY: ${BACKUPS_SECRET_KEY:-local-backups-secret-key}
      BACKUPS_BUCKET: tsela-backups
      BACKUP_RUN_ON_START: "true"
    volumes:
      - backup_data:/backups
      - wal_archive:/wal_archive
    depends_on:
      recovery-init:
        condition: service_completed_successfully
      objects-init:
        condition: service_completed_successfully

  # Drill targets: scratch servers that share no volume with the primary.
  restore-target:
    profiles: ["drill"]
    build:
      context: ./database
    container_name: transit-restore-target
    environment:
      POSTGRES_PASSWORD: restore-drill
      POSTGRES_USER: postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  restore-drill:
    profiles: ["drill"]
    build:
      context: ./ops/backups
    container_name: transit-restore-drill
    entrypoint: ["/usr/local/bin/restore-drill.sh"]
    environment:
      RESTORE_HOST: restore-target
      RESTORE_PASSWORD: restore-drill
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-local-only-passphrase-replace-in-real-use}
      OFFSITE_ENDPOINT: http://objects:9000
      OFFSITE_ACCESS_KEY: ${BACKUPS_ACCESS_KEY:-tsela-backups-app}
      OFFSITE_SECRET_KEY: ${BACKUPS_SECRET_KEY:-local-backups-secret-key}
      BACKUPS_BUCKET: tsela-backups
    volumes:
      - ./ops/backups/evidence:/evidence
    depends_on:
      restore-target:
        condition: service_healthy

  pitr-target:
    profiles: ["drill"]
    build:
      context: ./database
    container_name: transit-pitr-target
    user: root
    entrypoint: ["/bin/bash", "/pitr-restore.sh"]
    environment:
      RECOVERY_TARGET_TIME: ${RECOVERY_TARGET_TIME:-}
      BASE_BACKUP_DIR: /backups/base/current
    volumes:
      - backup_data:/backups:ro
      - wal_archive:/wal_archive:ro
      - ./ops/recovery/pitr-restore.sh:/pitr-restore.sh:ro
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  transit_system:
  wal_archive:
  backup_data:
  object_data:
  standby_data:
  prometheus_data:
  grafana_data:
  tempo_data:
